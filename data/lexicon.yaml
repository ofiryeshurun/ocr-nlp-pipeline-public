# Alcohol lexicon for the fuzzy lexicon matcher.
#
# - Strong terms only: one match is enough to flag an image as alcohol.
# - Built from general domain knowledge (drink types, major brands, classic
#   cocktails), NOT from the training data, so it can cover vocabulary that
#   new data may use.
# - Write terms in plain letters. The loader cleans them like OCR text
#   (lowercase, accents and punctuation removed), so "Moët" is stored as "moet"
#   and "Jack Daniel's" as "jack daniels".
#
# Left out on purpose:
# - Everyday words and names that are also drink names, because they would
#   flag ordinary text: corona, patron, malibu, manhattan, rose, spirits, shot,
#   sake, rye, punch, porter, bitter, mild, stella, miller, bud (also cannabis),
#   blue moon, fireball, wild turkey, southern comfort, cosmopolitan, mimosa,
#   bellini, old fashioned, barefoot, yellow tail.
# - Words that also name non-alcoholic products: cider (apple cider), scotch
#   (butterscotch). Their unambiguous forms stay ("hard cider", whisky).
# - Venue and context words (bar, pub, brewery, winery, nightlife, cheers) and
#   "brew": never decisive, and the lexicon has no weak list.
# - Exclusions for hard negatives ("ginger ale", "root beer", "mocktail"): none
#   up front; added only if evidence shows them.

categories:
  general:
    - alcohol
    - liquor
    - booze
    - moonshine
    - hard seltzer
    - hard cider
    - hard lemonade

